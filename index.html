    background: #050505;

    color: var(--text);

    display: flex;

    justify-content: center;

    position: relative;

}
       body::before {

    content: "";

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    background:
        linear-gradient(
            rgba(0, 0, 0, 0.72),
            rgba(0, 0, 0, 0.88)

    background-size: cover;

    background-repeat: no-repeat;

    pointer-events: none;

    z-index: 0;

}


        body.modal-open {
            overflow: hidden;
        }


        /* =========================================
           CONTAINER
        ========================================= */

       .container {

}

            display: block;

        }

           DESCRIÇÃO
        ========================================= */

            letter-spacing: 0.2px;

        }

            margin-bottom: 28px;

        }

            height: 52px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            text-decoration: none;

            color: white;

          background:
    linear-gradient(
        135deg,
        rgba(35,35,35,0.72),
        rgba(12,12,12,0.82)
    );

border:
    1px solid
    rgba(255,255,255,0.13);

backdrop-filter:
    blur(18px);

-webkit-backdrop-filter:
    blur(18px);

box-shadow:
    0 12px 40px
    rgba(0,0,0,0.35);
            cursor: pointer;

            transition:
                transform 0.2s ease,

        }


        .social-button:hover {

            transform:

            background:
                rgba(255,255,255,0.11);

            border-color:
                rgba(255,255,255,0.20);

        }


        .social-button svg {

            width: 24px;

            height: 24px;

        }


        /* =========================================
           LINKS PRINCIPAIS
        ========================================= */

        .main-links {

            width: 100%;

            display: flex;

            flex-direction: column;

            gap: 12px;

        }


        .main-link {

            width: 100%;

            min-height: 68px;

            padding: 12px 17px;

            border-radius: 17px;

            background:
                rgba(20,20,20,0.78);

            border:
                1px solid
                var(--border);

            backdrop-filter: blur(12px);

            -webkit-backdrop-filter: blur(12px);

            color: white;

            text-decoration: none;

            display: flex;

            align-items: center;

            position: relative;

            cursor: pointer;

            box-shadow:
                0 8px 28px
                rgba(0,0,0,0.22);

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                border-color 0.2s ease;

        }


        .main-link:hover {

            transform:
                translateY(-2px);

            background:
                rgba(30,30,30,0.88);

            border-color:
                rgba(255,255,255,0.16);

        }


        .main-icon {

            width: 43px;

            height: 43px;

            border-radius: 13px;

            background:
                rgba(255,255,255,0.07);

            display: flex;

            align-items: center;

            justify-content: center;

            margin-right: 14px;

            flex-shrink: 0;

        }


        .main-icon svg {

            width: 22px;

            height: 22px;

        }


        .main-content {

            display: flex;

            flex-direction: column;

            gap: 3px;

            text-align: left;

        }


        .main-title {

            font-size: 15px;

            font-weight: 600;

        }


        .main-subtitle {

            font-size: 11px;

            color: var(--muted);

        }


        .main-arrow {

            margin-left: auto;

            font-size: 23px;

            color: #666;

        }


        /* =========================================
           MODAL
        ========================================= */

        .modal {

            position: fixed;

            inset: 0;

            width: 100%;

            height: 100%;

            background:
                rgba(0,0,0,0.78);

            backdrop-filter:
                blur(10px);

            -webkit-backdrop-filter:
                blur(10px);

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 18px;

            z-index: 999;

            opacity: 0;

            visibility: hidden;

            transition:
                opacity 0.25s ease,
                visibility 0.25s ease;

        }


        .modal.active {

            opacity: 1;

            visibility: visible;

        }


        /* =========================================
           MODAL CONTENT
        ========================================= */

        .modal-content {

            width: 100%;

            max-width: 480px;

            max-height: 90vh;

            overflow-y: auto;

            background:
                #101010;

            border:
                1px solid
                rgba(255,255,255,0.11);

            border-radius: 23px;

            padding: 22px;

            box-shadow:
                0 30px 90px
                rgba(0,0,0,0.60);

            transform:
                translateY(20px)
                scale(0.96);

            transition:
                transform 0.25s ease;

        }


        .modal.active .modal-content {

            transform:
                translateY(0)
                scale(1);

        }


        /* =========================================
           MODAL HEADER
        ========================================= */

        .modal-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 20px;

        }


        .modal-title {

            font-size: 20px;

            font-weight: 700;

        }


        .modal-subtitle {

            font-size: 11px;

            color: var(--muted);

            margin-top: 4px;

        }


        .close-button {

            width: 36px;

            height: 36px;

            border-radius: 50%;

            border:
                1px solid
                rgba(255,255,255,0.08);

            background: #1a1a1a;

            color: white;

            font-size: 22px;

            display: flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;

            transition: 0.18s ease;

        }


        .close-button:hover {

            background: #292929;

        }


        /* =========================================
           UNIDADES
        ========================================= */

        .units {

            display: flex;

            flex-direction: column;

            gap: 11px;

        }


        .unit {

            width: 100%;

            padding: 15px;

            border-radius: 16px;

            background:
                #161616;

            border:
                1px solid
                rgba(255,255,255,0.07);

        }


        .unit-name {

            font-size: 15px;

            font-weight: 600;

            margin-bottom: 4px;

        }


        .unit-address {

            font-size: 11px;

            color: var(--muted);

            line-height: 1.5;

            margin-bottom: 13px;

        }


        .unit-button {

            width: 100%;

            min-height: 42px;

            border-radius: 10px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 7px;

            text-decoration: none;

            font-size: 11px;

            font-weight: 600;

            color: white;

            background:
                #202020;

            border:
                1px solid
                rgba(255,255,255,0.08);

            transition: 0.18s ease;

        }


        .unit-button:hover {

            background:
                #292929;

            transform:
                translateY(-1px);

        }


        .unit-button svg {

            width: 16px;

            height: 16px;

        }


        .review-button {

            background:
                white;

            color:
                #050505;

            border: none;

        }


        .review-button:hover {

            background:
                #eeeeee;

        }


        /* =========================================
           FOOTER
        ========================================= */

        .footer {

            margin-top: auto;

            padding-top: 40px;

            text-align: center;

        }


        .powered {

            font-size: 11px;

            color: #666;

            letter-spacing: 0.4px;

        }


        .powered strong {

            color: #999;

            font-weight: 600;

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 420px) {

            .container {

                padding:
                    32px 17px 22px;

            }


            .logo {

                max-width: 320px;

            }


            .social-button {

                width: 50px;

                height: 50px;

            }


            .modal {

                padding: 14px;

            }


            .modal-content {

                padding: 18px;

                border-radius: 20px;

                max-height: 92vh;

            }


            .modal-title {

                font-size: 18px;

            }

        }

    </style>

</head>

/* =====================================================
   ELEMENTOS
===================================================== */


const socials =
    document.getElementById(
        "socials"
    );


const mainLinks =
    document.getElementById(
        "mainLinks"
    );


const locationUnits =
    document.getElementById(
        "locationUnits"
    );


const reviewUnits =
    document.getElementById(
        "reviewUnits"
    );


/* =====================================================
   POPUPS
===================================================== */


const locationModal =
    document.getElementById(
        "locationModal"
    );


const reviewModal =
    document.getElementById(
        "reviewModal"
    );


/* =====================================================
   ABRIR MODAL
===================================================== */


function abrirModal(modal) {

    modal.classList.add(
        "active"
    );

    document.body.classList.add(
        "modal-open"
    );

}


/* =====================================================
   FECHAR MODAL
===================================================== */


function fecharModal(modal) {

    modal.classList.remove(
        "active"
    );

    document.body.classList.remove(
        "modal-open"
    );

}


/* =====================================================
   ÍCONES SOCIAIS
===================================================== */


/* WhatsApp */

const whatsappButton =
    document.createElement("a");


whatsappButton.className =
    "social-button";


whatsappButton.href =
    estabelecimento.whatsapp;


whatsappButton.target =
    "_blank";


whatsappButton.rel =
    "noopener noreferrer";


whatsappButton.setAttribute(
    "aria-label",
    "WhatsApp"
);


whatsappButton.innerHTML =
    whatsappIcon;


socials.appendChild(
    whatsappButton
);


/* Instagram */

const instagramButton =
    document.createElement("a");


instagramButton.className =
    "social-button";


instagramButton.href =
    estabelecimento.instagram;


instagramButton.target =
    "_blank";


instagramButton.rel =
    "noopener noreferrer";


instagramButton.setAttribute(
    "aria-label",
    "Instagram"
);


instagramButton.innerHTML =
    instagramIcon;


socials.appendChild(
    instagramButton
);


/* =====================================================
   LINKS PRINCIPAIS
===================================================== */


const links = [

    {

        icon:
            calendarIcon,

        title:
            "Agende seu horário",

        subtitle:
            "Escolha sua unidade e horário",

        url:
            estabelecimento.agendamento

    },


    {

        icon:
            locationIcon,

        title:
            "Localização",

        subtitle:
            "Encontre a unidade mais próxima",

        action:
            "location"

    },


    {

        icon:
            starIcon,

        title:
            "Avalie no Google",

        subtitle:
            "Deixe sua avaliação",

        action:
            "review"

    }

];


links.forEach(
    link => {


        const element =
            document.createElement(
                link.url
                    ? "a"
                    : "div"
            );


        element.className =
            "main-link";


        if (link.url) {

            element.href =
                link.url;

            element.target =
                "_blank";

            element.rel =
                "noopener noreferrer";

        }


        if (
            link.action ===
            "location"
        ) {

            element.addEventListener(
                "click",
                () => {

                    abrirModal(
                        locationModal
                    );

                }
            );

        }


        if (
            link.action ===
            "review"
        ) {

            element.addEventListener(
                "click",
                () => {

                    abrirModal(
                        reviewModal
                    );

                }
            );

        }


        element.innerHTML = `

            <div class="main-icon">

                ${link.icon}

            </div>


            <div class="main-content">

                <div class="main-title">

                    ${link.title}

                </div>


                <div class="main-subtitle">

                    ${link.subtitle}

                </div>

            </div>


            <div class="main-arrow">

                ›

            </div>

        `;


        mainLinks.appendChild(
            element
        );

    }
);

);

        reviewUnits.appendChild(
            element
        );

    }
);


/* =====================================================
   BOTÕES FECHAR
===================================================== */


document
    .querySelectorAll(
        "[data-close]"
    )
    .forEach(
        button => {


            button.addEventListener(
                "click",
                () => {


                    const modalId =
                        button.getAttribute(
                            "data-close"
                        );


                    fecharModal(
                        document.getElementById(
                            modalId
                        )
                    );

                }
            );

        }
    );


/* =====================================================
   FECHAR CLICANDO FORA
===================================================== */


locationModal.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            locationModal
        ) {

            fecharModal(
                locationModal
            );

        }

    }
);


reviewModal.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            reviewModal
        ) {

            fecharModal(
                reviewModal
            );

        }

    }
);


/* =====================================================
   FECHAR COM ESC
===================================================== */


document.addEventListener(
    "keydown",
    event => {


        if (
            event.key === "Escape"
        ) {

            fecharModal(
                locationModal
            );

            fecharModal(
                reviewModal
            );

        }

    }
);


</script>


</body>

</html>
