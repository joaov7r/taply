<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Barbearia Dom Roger</title>

    <style>

        :root {
            --primary: #050505;
            --secondary: #111111;
            --text: #ffffff;
            --muted: #969696;
            --border: rgba(255,255,255,0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top,
                    rgba(255,255,255,0.07),
                    transparent 38%
                ),
                var(--primary);

            color: var(--text);

            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 520px;
            min-height: 100vh;

            padding: 38px 22px 24px;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* =========================
           LOGO
        ========================= */

        .logo {
            width: 100%;
            max-width: 350px;

            margin-bottom: 15px;

            display: flex;
            justify-content: center;
        }

        .logo img {
            width: 100%;
            height: auto;

            display: block;

            object-fit: contain;
        }

        /* =========================
           DESCRIÇÃO
        ========================= */

        .description {
            font-size: 13px;

            color: var(--muted);

            text-align: center;

            line-height: 1.6;

            max-width: 350px;

            margin-bottom: 28px;

            letter-spacing: 0.2px;
        }

        /* =========================
           LINKS PRINCIPAIS
        ========================= */

        .main-links {
            width: 100%;

            display: flex;
            flex-direction: column;

            gap: 12px;
        }

        .link {
            width: 100%;
            min-height: 62px;

            padding: 12px 16px;

            border-radius: 16px;

            background: var(--secondary);

            border: 1px solid var(--border);

            color: var(--text);

            text-decoration: none;

            display: flex;
            align-items: center;

            position: relative;

            transition: 0.18s ease;

            box-shadow:
                0 6px 20px rgba(0,0,0,0.20);

            cursor: pointer;
        }

        .link:hover {
            transform: translateY(-2px);

            background: #181818;

            border-color:
                rgba(255,255,255,0.15);
        }

        .icon {
            width: 40px;
            height: 40px;

            border-radius: 12px;

            background:
                rgba(255,255,255,0.07);

            display: flex;
            align-items: center;
            justify-content: center;

            margin-right: 14px;

            flex-shrink: 0;
        }

        .icon svg {
            width: 21px;
            height: 21px;

            display: block;
        }

        .link-content {
            display: flex;

            flex-direction: column;

            gap: 3px;

            text-align: left;
        }

        .link-title {
            font-size: 15px;

            font-weight: 600;
        }

        .link-subtitle {
            font-size: 11px;

            color: var(--muted);
        }

        .arrow {
            margin-left: auto;

            font-size: 22px;

            color: #666;

            transition:
                transform 0.25s ease;
        }

        /* =========================
           MENU UNIDADES
        ========================= */

        .units-container {
            width: 100%;

            display: none;

            flex-direction: column;

            gap: 10px;

            margin-top: 12px;

            margin-bottom: 12px;

            animation:
                fadeIn 0.25s ease;
        }

        .units-container.open {
            display: flex;
        }

        .units-menu.open .arrow {
            transform:
                rotate(90deg);
        }

        @keyframes fadeIn {

            from {
                opacity: 0;
                transform:
                    translateY(-6px);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0);
            }

        }

        /* =========================
           CARD DA UNIDADE
        ========================= */

        .unit {
            width: 100%;

            padding: 15px;

            border-radius: 15px;

            background: #0d0d0d;

            border:
                1px solid
                rgba(255,255,255,0.07);

            box-shadow:
                0 4px 15px
                rgba(0,0,0,0.15);
        }

        .unit-name {
            font-size: 15px;

            font-weight: 600;

            margin-bottom: 4px;
        }

        .unit-address {
            font-size: 11px;

            color: var(--muted);

            margin-bottom: 13px;

            line-height: 1.4;
        }

        .unit-actions {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 8px;
        }

        .unit-button {
            min-height: 40px;

            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 7px;

            text-decoration: none;

            font-size: 11px;

            font-weight: 600;

            color: #fff;

            background: #1b1b1b;

            border:
                1px solid
                rgba(255,255,255,0.08);

            transition:
                0.18s ease;
        }

        .unit-button:hover {
            background: #242424;

            transform:
                translateY(-1px);
        }

        .unit-button svg {
            width: 15px;
            height: 15px;

            display: block;
        }

        .review-button {
            background: #ffffff;

            color: #050505;

            border: none;
        }

        .review-button:hover {
            background: #eeeeee;
        }

        /* =========================
           FOOTER
        ========================= */

        .footer {
            margin-top: auto;

            padding-top: 38px;

            text-align: center;
        }

        .powered {
            font-size: 11px;

            color: #666;

            letter-spacing: 0.4px;
        }

        .powered strong {
            color: #999;

            font-weight: 600;
        }

        /* =========================
           CELULAR
        ========================= */

        @media (max-width: 420px) {

            .container {
                padding:
                    30px 17px 22px;
            }

            .logo {
                max-width: 320px;
            }

            .unit {
                padding: 14px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- =========================
         LOGO
    ========================= -->

    <div class="logo">

        <img
            src="logo-dom-roger.png"
            alt="Barbearia Dom Roger"
        >

    </div>


    <!-- =========================
         DESCRIÇÃO
    ========================= -->

    <p class="description">

        Corte • Barba • Estilo<br>

        Atendimento com qualidade e personalidade.

    </p>


    <!-- =========================
         LINKS
    ========================= -->

    <div
        class="main-links"
        id="mainLinks"
    ></div>


    <!-- =========================
         UNIDADES
    ========================= -->

    <div
        class="units-container"
        id="unitsContainer"
    ></div>


    <!-- =========================
         FOOTER
    ========================= -->

    <div class="footer">

        <div class="powered">

            Powered by <strong>Taply</strong>

        </div>

    </div>


</div>


<script>


/* =====================================================
   ÍCONES
===================================================== */


const locationIcon = `

<svg viewBox="0 0 24 24">

    <path
        d="M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
    />

    <circle
        cx="12"
        cy="9"
        r="2.2"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
    />

</svg>

`;


const starIcon = `

<svg viewBox="0 0 24 24">

    <path
        d="M12 3.5l2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.9l6.1-.9L12 3.5z"
        fill="currentColor"
    />

</svg>

`;


const whatsappIcon = `

<svg viewBox="0 0 48 48">

    <path
        fill="#25D366"
        d="M24 4C13 4 4 12.9 4 23.8c0 3.5.9 6.9 2.7 9.9L4 44l10.6-2.7c2.9 1.6 6.1 2.4 9.4 2.4 11 0 20-8.9 20-19.9S35 4 24 4z"
    />

    <path
        fill="#fff"
        d="M34.5 28.7c-.5-.3-3.1-1.5-3.6-1.7-.5-.2-.8-.3-1.2.3-.3.5-1.3 1.7-1.6 2.1-.3.4-.6.4-1.1.1-.5-.3-2.1-.8-4-2.5-1.5-1.3-2.5-2.9-2.8-3.4-.3-.5 0-.8.2-1.1.2-.2.5-.6.8-.9.3-.3.3-.5.5-.9.2-.4.1-.7 0-1-.1-.3-1.2-2.9-1.7-4-.5-1.1-1-1-1.3-1h-1.1c-.4 0-1 .1-1.5.7-.5.5-2 1.9-2 4.6s2 5.3 2.3 5.7c.3.4 3.9 6 9.4 8.4 1.3.6 2.4 1 3.2 1.2 1.3.4 2.5.3 3.4.2 1-.1 3.1-1.3 3.5-2.5.4-1.2.4-2.2.3-2.5-.1-.3-.5-.4-1-.7z"
    />

</svg>

`;


const instagramIcon = `

<svg viewBox="0 0 48 48">

    <defs>

        <linearGradient
            id="instagramGradient"
            x1="0%"
            y1="100%"
            x2="100%"
            y2="0%"
        >

            <stop
                offset="0%"
                stop-color="#FFDD55"
            />

            <stop
                offset="30%"
                stop-color="#FF543E"
            />

            <stop
                offset="60%"
                stop-color="#C837AB"
            />

            <stop
                offset="100%"
                stop-color="#405DE6"
            />

        </linearGradient>

    </defs>


    <rect
        x="4"
        y="4"
        width="40"
        height="40"
        rx="11"
        fill="url(#instagramGradient)"
    />


    <circle
        cx="24"
        cy="24"
        r="9"
        fill="none"
        stroke="#fff"
        stroke-width="3"
    />


    <circle
        cx="34"
        cy="14"
        r="2.2"
        fill="#fff"
    />

</svg>

`;


const calendarIcon = `

<svg viewBox="0 0 24 24">

    <rect
        x="3"
        y="5"
        width="18"
        height="16"
        rx="2"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
    />

    <path
        d="M16 3v4M8 3v4M3 10h18"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
    />

</svg>

`;


/* =====================================================
   DADOS DO CLIENTE
===================================================== */


const estabelecimento = {

    whatsapp:
        "https://wa.me/551198734659",

    instagram:
        "https://www.instagram.com/dom.roger_/",

    agendamento:
        "https://cashbarber.com.br/barbeariadomroger/inicio",

    unidades: [

        {
            nome:
                "Jardim da Glória",

            endereco:
                "Cotia - SP",

            maps:
                "https://share.google/I5p1aL1oMb2lvJbr3",

            google:
                "https://www.google.com/search?q=Barbearia+Dom+Roger+Jardim+Da+Gl%C3%B3ria+Cotia"
        },


        {
            nome:
                "Matriz",

            endereco:
                "Av. Eid Mansur, 803 - Parque São George",

            maps:
                "https://share.google/pO2cxL504a6fTDSEa",

            google:
                "https://www.google.com/search?q=Barbearia+Dom+Roger+Matriz+Cotia"
        },


        {
            nome:
                "Vianna Village",

            endereco:
                "R. Mesopotâmia, 109 - Cotia",

            maps:
                "https://share.google/yslnNkrHiEY3EZdB3",

            google:
                "https://www.google.com/search?q=Barbearia+Dom+Roger+Vianna+Village+Cotia"
        },


        {
            nome:
                "Capuava",

            endereco:
                "Estr. do Capuava, 4421 - Cotia",

            maps:
                "https://share.google/3BkKdrDc8EXBG0CYs",

            google:
                "https://www.google.com/search?q=Barbearia+Dom+Roger+Capuava+Cotia"
        }

    ]

};


/* =====================================================
   ELEMENTOS
===================================================== */


const mainLinks =
    document.getElementById(
        "mainLinks"
    );


const unitsContainer =
    document.getElementById(
        "unitsContainer"
    );


/* =====================================================
   BOTÃO DE UNIDADES
===================================================== */


const unitsMenu =
    document.createElement("div");


unitsMenu.className =
    "link units-menu";


unitsMenu.innerHTML = `

    <div class="icon">

        ${locationIcon}

    </div>


    <div class="link-content">

        <div class="link-title">

            Nossas unidades

        </div>


        <div class="link-subtitle">

            Escolha a unidade mais próxima

        </div>

    </div>


    <div class="arrow">

        ›

    </div>

`;


mainLinks.appendChild(
    unitsMenu
);


/* =====================================================
   OUTROS LINKS
===================================================== */


const links = [

    {

        icon:
            whatsappIcon,

        title:
            "Fale conosco",

        subtitle:
            "Entre em contato pelo WhatsApp",

        url:
            estabelecimento.whatsapp

    },


    {

        icon:
            instagramIcon,

        title:
            "Siga no Instagram",

        subtitle:
            "@dom.roger_",

        url:
            estabelecimento.instagram

    },


    {

        icon:
            calendarIcon,

        title:
            "Agende seu horário",

        subtitle:
            "Escolha sua unidade e horário",

        url:
            estabelecimento.agendamento

    }

];


links.forEach(link => {


    const element =
        document.createElement("a");


    element.className =
        "link";


    element.href =
        link.url;


    element.target =
        "_blank";


    element.rel =
        "noopener noreferrer";


    element.innerHTML = `

        <div class="icon">

            ${link.icon}

        </div>


        <div class="link-content">

            <div class="link-title">

                ${link.title}

            </div>


            <div class="link-subtitle">

                ${link.subtitle}

            </div>

        </div>


        <div class="arrow">

            ›

        </div>

    `;


    mainLinks.appendChild(
        element
    );

});


/* =====================================================
   CRIAR UNIDADES
===================================================== */


estabelecimento.unidades.forEach(
    unidade => {


        const element =
            document.createElement("div");


        element.className =
            "unit";


        element.innerHTML = `

            <div class="unit-name">

                ${unidade.nome}

            </div>


            <div class="unit-address">

                ${unidade.endereco}

            </div>


            <div class="unit-actions">


                <a
                    class="unit-button"
                    href="${unidade.maps}"
                    target="_blank"
                    rel="noopener noreferrer"
                >

                    ${locationIcon}

                    Como chegar

                </a>


                <a
                    class="unit-button review-button"
                    href="${unidade.google}"
                    target="_blank"
                    rel="noopener noreferrer"
                >

                    ${starIcon}

                    Avaliar no Google

                </a>


            </div>

        `;


        unitsContainer.appendChild(
            element
        );

    }
);


/* =====================================================
   ABRIR / FECHAR UNIDADES
===================================================== */


unitsMenu.addEventListener(
    "click",
    () => {


        const aberto =
            unitsContainer.classList.toggle(
                "open"
            );


        unitsMenu.classList.toggle(
            "open",
            aberto
        );


    }
);


</script>


</body>

</html>
