<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Barbearia Dom Roger</title>

    <style>

        :root {
            --primary: #050505;
            --secondary: #111111;
            --accent: #ffffff;
            --text: #ffffff;
            --muted: #969696;
            --border: rgba(255,255,255,0.08);
        }


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top,
                    rgba(255,255,255,0.07),
                    transparent 38%
                ),
                var(--primary);

            color: var(--text);

            display: flex;
            justify-content: center;

        }


        /* ==========================================
           CONTAINER
           ========================================== */

        .container {

            width: 100%;
            max-width: 520px;

            min-height: 100vh;

            padding: 38px 22px 24px;

            display: flex;
            flex-direction: column;
            align-items: center;

        }


        /* ==========================================
           LOGO
           ========================================== */

        .logo {

            width: 100%;
            max-width: 350px;

            margin-bottom: 18px;

            display: flex;
            justify-content: center;

        }


        .logo img {

            width: 100%;
            height: auto;

            display: block;

            object-fit: contain;

        }


        /* ==========================================
           DESCRIÇÃO
           ========================================== */

        .description {

            font-size: 13px;

            color: var(--muted);

            text-align: center;

            line-height: 1.6;

            max-width: 350px;

            margin-bottom: 30px;

            letter-spacing: 0.2px;

        }


        /* ==========================================
           LINKS
           ========================================== */

        .links {

            width: 100%;

            display: flex;

            flex-direction: column;

            gap: 12px;

        }


        /* ==========================================
           BOTÃO
           ========================================== */

        .link {

            width: 100%;

            min-height: 64px;

            padding: 12px 16px;

            border-radius: 16px;

            background: var(--secondary);

            border: 1px solid var(--border);

            color: var(--text);

            text-decoration: none;

            display: flex;

            align-items: center;

            position: relative;

            transition:
                transform 0.18s ease,
                background 0.18s ease,
                border-color 0.18s ease;

            box-shadow:
                0 6px 20px rgba(0,0,0,0.20);

        }


        .link:hover {

            transform: translateY(-2px);

            background: #181818;

            border-color:
                rgba(255,255,255,0.15);

        }


        .link:active {

            transform: scale(0.985);

        }


        /* ==========================================
           ÍCONE
           ========================================== */

        .icon {

            width: 40px;
            height: 40px;

            border-radius: 12px;

            background:
                rgba(255,255,255,0.07);

            display: flex;

            align-items: center;
            justify-content: center;

            margin-right: 14px;

            flex-shrink: 0;

        }


       .icon svg {
            width: 21px;
            height: 21px;

            display: block;


            stroke: currentColor;

            fill: none;

            stroke-width: 1.8;

            stroke-linecap: round;

            stroke-linejoin: round;

        }


        /* ==========================================
           TEXTO
           ========================================== */

        .link-content {

            display: flex;

            flex-direction: column;

            gap: 3px;

            text-align: left;

        }


        .link-title {

            font-size: 15px;

            font-weight: 600;

            letter-spacing: -0.1px;

        }


        .link-subtitle {

            font-size: 11px;

            color: var(--muted);

        }


        /* ==========================================
           SETA
           ========================================== */

        .arrow {

            margin-left: auto;

            font-size: 22px;

            font-weight: 300;

            color: #666;

            padding-left: 10px;

        }


        /* ==========================================
           GOOGLE
           ========================================== */

        .google {

            background: #ffffff;

            color: #050505;

            border: none;

        }


        .google .icon {

            background: #eeeeee;

        }


        .google .link-subtitle {

            color: #666666;

        }


        .google .arrow {

            color: #777777;

        }


        .google:hover {

            background: #f2f2f2;

        }


        /* ==========================================
           WHATSAPP
           ========================================== */

        .whatsapp {

            border-color:
                rgba(255,255,255,0.12);

        }


        .whatsapp .icon {

            background:
                rgba(255,255,255,0.11);

        }


        /* ==========================================
           FOOTER
           ========================================== */

        .footer {

            margin-top: auto;

            padding-top: 38px;

            text-align: center;

        }


        .powered {

            font-size: 11px;

            color: #666;

            letter-spacing: 0.4px;

        }


        .powered strong {

            color: #999;

            font-weight: 600;

        }


        /* ==========================================
           CELULAR
           ========================================== */

        @media (max-width: 420px) {

            .container {

                padding:
                    30px
                    17px
                    22px;

            }


            .logo {

                max-width: 320px;

                margin-bottom: 15px;

            }


            .description {

                font-size: 12px;

                margin-bottom: 25px;

            }


            .link {

                min-height: 61px;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- ==========================================
         LOGO
         ========================================== -->

    <div class="logo">

        <img
            src="logo-dom-roger.png"
            alt="Barbearia Dom Roger"
        >

    </div>


    <!-- ==========================================
         DESCRIÇÃO
         ========================================== -->

    <p
        class="description"
        id="description"
    >
        Corte • Barba • Estilo<br>
        Atendimento com qualidade e personalidade.
    </p>


    <!-- ==========================================
         BOTÕES
         ========================================== -->

    <div
        class="links"
        id="links"
    ></div>


    <!-- ==========================================
         FOOTER
         ========================================== -->

    <div class="footer">

        <div class="powered">

            Powered by
            <strong>Taply</strong>

        </div>

    </div>


</div>


<script>


/* ==================================================
   CONFIGURAÇÃO DO ESTABELECIMENTO
   ================================================== */


const estabelecimento = {


    descricao:
        "Corte • Barba • Estilo<br>Atendimento com qualidade e personalidade.",


    /* CORES */

    corPrincipal:
        "#050505",

    corSecundaria:
        "#111111",

    corDestaque:
        "#FFFFFF",

    corTexto:
        "#FFFFFF",

    corTextoSecundario:
        "#969696",


    /* LINKS */

    google:
        "https://www.google.com/",

    whatsapp:
        "https://wa.me/5511999999999",

    instagram:
        "https://instagram.com/",

    maps:
        "https://maps.google.com/",

    servicos:
        "#",

    agendamento:
        "#"

};


/* ==================================================
   APLICA CORES
   ================================================== */


document.documentElement.style.setProperty(
    "--primary",
    estabelecimento.corPrincipal
);


document.documentElement.style.setProperty(
    "--secondary",
    estabelecimento.corSecundaria
);


document.documentElement.style.setProperty(
    "--accent",
    estabelecimento.corDestaque
);


document.documentElement.style.setProperty(
    "--text",
    estabelecimento.corTexto
);


document.documentElement.style.setProperty(
    "--muted",
    estabelecimento.corTextoSecundario
);


/* ==================================================
   DESCRIÇÃO
   ================================================== */


document.getElementById(
    "description"
).innerHTML =
    estabelecimento.descricao;


/* ==================================================
   ÍCONES
   ================================================== */


const icons = {

    google: `
        <svg viewBox="0 0 48 48">
            <path fill="#4285F4"
                d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.3 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.3l7.8 6.1C12.3 13.9 17.7 9.5 24 9.5z"/>
            <path fill="#34A853"
                d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.5 3-2.3 5.5-4.8 7.2l7.7 6c4.5-4.1 6.9-10.1 6.9-17.7z"/>
            <path fill="#FBBC05"
                d="M10.4 28.6c-1-3-1-6.2 0-9.2l-7.8-6.1c-3.5 6.9-3.5 15.1 0 22l7.8-6.7z"/>
            <path fill="#EA4335"
                d="M24 48c6.2 0 11.4-2 15.3-5.8l-7.7-6c-2.1 1.4-4.7 2.2-7.6 2.2-6.3 0-11.7-4.3-13.6-10.1l-7.8 6.1C6.5 42.6 14.6 48 24 48z"/>
        </svg>
    `,

    whatsapp: `
        <svg viewBox="0 0 48 48">
            <path fill="#25D366"
                d="M24 4C13 4 4 12.9 4 23.8c0 3.5.9 6.9 2.7 9.9L4 44l10.6-2.7c2.9 1.6 6.1 2.4 9.4 2.4 11 0 20-8.9 20-19.9S35 4 24 4z"/>
            <path fill="#fff"
                d="M34.5 28.7c-.5-.3-3.1-1.5-3.6-1.7-.5-.2-.8-.3-1.2.3-.3.5-1.3 1.7-1.6 2.1-.3.4-.6.4-1.1.1-.5-.3-2.1-.8-4-2.5-1.5-1.3-2.5-2.9-2.8-3.4-.3-.5 0-.8.2-1.1.2-.2.5-.6.8-.9.3-.3.3-.5.5-.9.2-.4.1-.7 0-1-.1-.3-1.2-2.9-1.7-4-.5-1.1-1-1-1.3-1h-1.1c-.4 0-1 .1-1.5.7-.5.5-2 1.9-2 4.6s2 5.3 2.3 5.7c.3.4 3.9 6 9.4 8.4 1.3.6 2.4 1 3.2 1.2 1.3.4 2.5.3 3.4.2 1-.1 3.1-1.3 3.5-2.5.4-1.2.4-2.2.3-2.5-.1-.3-.5-.4-1-.7z"/>
        </svg>
    `,

    instagram: `
        <svg viewBox="0 0 48 48">
            <defs>
                <linearGradient id="ig" x1="0%" y1="100%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#FFDD55"/>
                    <stop offset="30%" stop-color="#FF543E"/>
                    <stop offset="60%" stop-color="#C837AB"/>
                    <stop offset="100%" stop-color="#405DE6"/>
                </linearGradient>
            </defs>

            <rect
                x="4"
                y="4"
                width="40"
                height="40"
                rx="11"
                fill="url(#ig)"
            />

            <circle
                cx="24"
                cy="24"
                r="9"
                fill="none"
                stroke="#fff"
                stroke-width="3"
            />

            <circle
                cx="34"
                cy="14"
                r="2.2"
                fill="#fff"
            />
        </svg>
    `,

    maps: `
        <svg viewBox="0 0 48 48">
            <path
                fill="#EA4335"
                d="M24 4C15.2 4 8 11.2 8 20c0 11.8 16 24 16 24s16-12.2 16-24C40 11.2 32.8 4 24 4z"
            />

            <circle
                cx="24"
                cy="20"
                r="6"
                fill="#fff"
            />
        </svg>
    `,

    services: `
        <svg viewBox="0 0 48 48">

            <path
                d="M10 10L38 38"
                stroke="currentColor"
                stroke-width="4"
                stroke-linecap="round"
            />

            <path
                d="M38 10L10 38"
                stroke="currentColor"
                stroke-width="4"
                stroke-linecap="round"
            />

            <circle
                cx="10"
                cy="10"
                r="4"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
            />

            <circle
                cx="38"
                cy="10"
                r="4"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
            />

        </svg>
    `,

    calendar: `
        <svg viewBox="0 0 48 48">

            <rect
                x="7"
                y="10"
                width="34"
                height="31"
                rx="4"
                fill="none"
                stroke="currentColor"
                stroke-width="3"
            />

            <path
                d="M7 18h34"
                stroke="currentColor"
                stroke-width="3"
            />

            <path
                d="M16 5v9M32 5v9"
                stroke="currentColor"
                stroke-width="3"
                stroke-linecap="round"
            />

        </svg>
    `
};

/* ==================================================
   BOTÕES
   ================================================== */


const links = [


    {

        icon:
            icons.google,

        title:
            "Avalie no Google",

        subtitle:
            "Sua opinião é muito importante",

        url:
            estabelecimento.google,

        className:
            "google"

    },


    {

        icon:
            icons.whatsapp,

        title:
            "Fale conosco",

        subtitle:
            "Entre em contato pelo WhatsApp",

        url:
            estabelecimento.whatsapp,

        className:
            "whatsapp"

    },


    {

        icon:
            icons.instagram,

        title:
            "Siga no Instagram",

        subtitle:
            "Acompanhe nosso trabalho",

        url:
            estabelecimento.instagram

    },


    {

        icon:
            icons.maps,

        title:
            "Como chegar",

        subtitle:
            "Veja nossa localização",

        url:
            estabelecimento.maps

    },


    {

        icon:
            icons.services,

        title:
            "Nossos serviços",

        subtitle:
            "Conheça nossos serviços",

        url:
            estabelecimento.servicos

    },


    {

        icon:
            icons.calendar,

        title:
            "Agende seu horário",

        subtitle:
            "Reserve seu atendimento",

        url:
            estabelecimento.agendamento

    }


];


/* ==================================================
   CRIAÇÃO DOS BOTÕES
   ================================================== */


const linksContainer =
    document.getElementById("links");


links.forEach(link => {


    const element =
        document.createElement("a");


    element.href =
        link.url;


    element.target =
        "_blank";


    element.rel =
        "noopener noreferrer";


    element.className =
        "link" +
        (
            link.className
                ? " " + link.className
                : ""
        );


    element.innerHTML = `

        <div class="icon">

            ${link.icon}

        </div>


        <div class="link-content">

            <div class="link-title">

                ${link.title}

            </div>


            <div class="link-subtitle">

                ${link.subtitle}

            </div>

        </div>


        <div class="arrow">

            ›

        </div>

    `;


    linksContainer.appendChild(
        element
    );


});


</script>


</body>

</html>
