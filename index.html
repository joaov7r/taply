<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Barbearia Dom Roger</title>

    <style>

        :root {
            --primary: #050505;
            --secondary: #111111;
            --accent: #ffffff;
            --text: #ffffff;
            --muted: #969696;
            --border: rgba(255,255,255,0.08);
        }


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top,
                    rgba(255,255,255,0.07),
                    transparent 38%
                ),
                var(--primary);

            color: var(--text);

            display: flex;
            justify-content: center;

        }


        /* ==========================================
           CONTAINER
           ========================================== */

        .container {

            width: 100%;
            max-width: 520px;

            min-height: 100vh;

            padding: 38px 22px 24px;

            display: flex;
            flex-direction: column;
            align-items: center;

        }


        /* ==========================================
           LOGO
           ========================================== */

        .logo {

            width: 100%;
            max-width: 350px;

            margin-bottom: 18px;

            display: flex;
            justify-content: center;

        }


        .logo img {

            width: 100%;
            height: auto;

            display: block;

            object-fit: contain;

        }


        /* ==========================================
           DESCRIÇÃO
           ========================================== */

        .description {

            font-size: 13px;

            color: var(--muted);

            text-align: center;

            line-height: 1.6;

            max-width: 350px;

            margin-bottom: 30px;

            letter-spacing: 0.2px;

        }


        /* ==========================================
           LINKS
           ========================================== */

        .links {

            width: 100%;

            display: flex;

            flex-direction: column;

            gap: 12px;

        }


        /* ==========================================
           BOTÃO
           ========================================== */

        .link {

            width: 100%;

            min-height: 64px;

            padding: 12px 16px;

            border-radius: 16px;

            background: var(--secondary);

            border: 1px solid var(--border);

            color: var(--text);

            text-decoration: none;

            display: flex;

            align-items: center;

            position: relative;

            transition:
                transform 0.18s ease,
                background 0.18s ease,
                border-color 0.18s ease;

            box-shadow:
                0 6px 20px rgba(0,0,0,0.20);

        }


        .link:hover {

            transform: translateY(-2px);

            background: #181818;

            border-color:
                rgba(255,255,255,0.15);

        }


        .link:active {

            transform: scale(0.985);

        }


        /* ==========================================
           ÍCONE
           ========================================== */

        .icon {

            width: 40px;
            height: 40px;

            border-radius: 12px;

            background:
                rgba(255,255,255,0.07);

            display: flex;

            align-items: center;
            justify-content: center;

            margin-right: 14px;

            flex-shrink: 0;

        }


        .icon svg {

            width: 19px;
            height: 19px;

            stroke: currentColor;

            fill: none;

            stroke-width: 1.8;

            stroke-linecap: round;

            stroke-linejoin: round;

        }


        /* ==========================================
           TEXTO
           ========================================== */

        .link-content {

            display: flex;

            flex-direction: column;

            gap: 3px;

            text-align: left;

        }


        .link-title {

            font-size: 15px;

            font-weight: 600;

            letter-spacing: -0.1px;

        }


        .link-subtitle {

            font-size: 11px;

            color: var(--muted);

        }


        /* ==========================================
           SETA
           ========================================== */

        .arrow {

            margin-left: auto;

            font-size: 22px;

            font-weight: 300;

            color: #666;

            padding-left: 10px;

        }


        /* ==========================================
           GOOGLE
           ========================================== */

        .google {

            background: #ffffff;

            color: #050505;

            border: none;

        }


        .google .icon {

            background: #eeeeee;

        }


        .google .link-subtitle {

            color: #666666;

        }


        .google .arrow {

            color: #777777;

        }


        .google:hover {

            background: #f2f2f2;

        }


        /* ==========================================
           WHATSAPP
           ========================================== */

        .whatsapp {

            border-color:
                rgba(255,255,255,0.12);

        }


        .whatsapp .icon {

            background:
                rgba(255,255,255,0.11);

        }


        /* ==========================================
           FOOTER
           ========================================== */

        .footer {

            margin-top: auto;

            padding-top: 38px;

            text-align: center;

        }


        .powered {

            font-size: 11px;

            color: #666;

            letter-spacing: 0.4px;

        }


        .powered strong {

            color: #999;

            font-weight: 600;

        }


        /* ==========================================
           CELULAR
           ========================================== */

        @media (max-width: 420px) {

            .container {

                padding:
                    30px
                    17px
                    22px;

            }


            .logo {

                max-width: 320px;

                margin-bottom: 15px;

            }


            .description {

                font-size: 12px;

                margin-bottom: 25px;

            }


            .link {

                min-height: 61px;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- ==========================================
         LOGO
         ========================================== -->

    <div class="logo">

        <img
            src="logo-dom-roger.png"
            alt="Barbearia Dom Roger"
        >

    </div>


    <!-- ==========================================
         DESCRIÇÃO
         ========================================== -->

    <p
        class="description"
        id="description"
    >
        Corte • Barba • Estilo<br>
        Atendimento com qualidade e personalidade.
    </p>


    <!-- ==========================================
         BOTÕES
         ========================================== -->

    <div
        class="links"
        id="links"
    ></div>


    <!-- ==========================================
         FOOTER
         ========================================== -->

    <div class="footer">

        <div class="powered">

            Powered by
            <strong>Taply</strong>

        </div>

    </div>


</div>


<script>


/* ==================================================
   CONFIGURAÇÃO DO ESTABELECIMENTO
   ================================================== */


const estabelecimento = {


    descricao:
        "Corte • Barba • Estilo<br>Atendimento com qualidade e personalidade.",


    /* CORES */

    corPrincipal:
        "#050505",

    corSecundaria:
        "#111111",

    corDestaque:
        "#FFFFFF",

    corTexto:
        "#FFFFFF",

    corTextoSecundario:
        "#969696",


    /* LINKS */

    google:
        "https://www.google.com/",

    whatsapp:
        "https://wa.me/5511999999999",

    instagram:
        "https://instagram.com/",

    maps:
        "https://maps.google.com/",

    servicos:
        "#",

    agendamento:
        "#"

};


/* ==================================================
   APLICA CORES
   ================================================== */


document.documentElement.style.setProperty(
    "--primary",
    estabelecimento.corPrincipal
);


document.documentElement.style.setProperty(
    "--secondary",
    estabelecimento.corSecundaria
);


document.documentElement.style.setProperty(
    "--accent",
    estabelecimento.corDestaque
);


document.documentElement.style.setProperty(
    "--text",
    estabelecimento.corTexto
);


document.documentElement.style.setProperty(
    "--muted",
    estabelecimento.corTextoSecundario
);


/* ==================================================
   DESCRIÇÃO
   ================================================== */


document.getElementById(
    "description"
).innerHTML =
    estabelecimento.descricao;


/* ==================================================
   ÍCONES
   ================================================== */


const icons = {


    google: `
        <svg viewBox="0 0 24 24">
            <path d="M12 3a9 9 0 1 0 9 9"/>
            <path d="M21 8h-9"/>
            <path d="M21 8v5"/>
        </svg>
    `,


    whatsapp: `
        <svg viewBox="0 0 24 24">
            <path d="M20 11.5a8 8 0 0 1-11.8 7L4 20l1.5-4A8 8 0 1 1 20 11.5Z"/>
            <path d="M8.5 9.5c.3 1.7 2.3 3.7 4 4"/>
            <path d="M8.8 8.8c.3-.4.7-.4 1-.1l.8.9c.2.2.2.5 0 .8l-.4.5"/>
        </svg>
    `,


    instagram: `
        <svg viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17.5" cy="6.5" r="1"/>
        </svg>
    `,


    maps: `
        <svg viewBox="0 0 24 24">
            <path d="M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z"/>
            <circle cx="12" cy="9" r="2.2"/>
        </svg>
    `,


    services: `
        <svg viewBox="0 0 24 24">
            <path d="M6 4v16"/>
            <path d="M18 4v16"/>
            <path d="M4 8h4"/>
            <path d="M16 16h4"/>
            <path d="M8 12h8"/>
        </svg>
    `,


    calendar: `
        <svg viewBox="0 0 24 24">
            <rect x="3" y="5" width="18" height="16" rx="2"/>
            <path d="M16 3v4"/>
            <path d="M8 3v4"/>
            <path d="M3 10h18"/>
            <path d="M8 14h2"/>
            <path d="M14 14h2"/>
        </svg>
    `

};


/* ==================================================
   BOTÕES
   ================================================== */


const links = [


    {

        icon:
            icons.google,

        title:
            "Avalie no Google",

        subtitle:
            "Sua opinião é muito importante",

        url:
            estabelecimento.google,

        className:
            "google"

    },


    {

        icon:
            icons.whatsapp,

        title:
            "Fale conosco",

        subtitle:
            "Entre em contato pelo WhatsApp",

        url:
            estabelecimento.whatsapp,

        className:
            "whatsapp"

    },


    {

        icon:
            icons.instagram,

        title:
            "Siga no Instagram",

        subtitle:
            "Acompanhe nosso trabalho",

        url:
            estabelecimento.instagram

    },


    {

        icon:
            icons.maps,

        title:
            "Como chegar",

        subtitle:
            "Veja nossa localização",

        url:
            estabelecimento.maps

    },


    {

        icon:
            icons.services,

        title:
            "Nossos serviços",

        subtitle:
            "Conheça nossos serviços",

        url:
            estabelecimento.servicos

    },


    {

        icon:
            icons.calendar,

        title:
            "Agende seu horário",

        subtitle:
            "Reserve seu atendimento",

        url:
            estabelecimento.agendamento

    }


];


/* ==================================================
   CRIAÇÃO DOS BOTÕES
   ================================================== */


const linksContainer =
    document.getElementById("links");


links.forEach(link => {


    const element =
        document.createElement("a");


    element.href =
        link.url;


    element.target =
        "_blank";


    element.rel =
        "noopener noreferrer";


    element.className =
        "link" +
        (
            link.className
                ? " " + link.className
                : ""
        );


    element.innerHTML = `

        <div class="icon">

            ${link.icon}

        </div>


        <div class="link-content">

            <div class="link-title">

                ${link.title}

            </div>


            <div class="link-subtitle">

                ${link.subtitle}

            </div>

        </div>


        <div class="arrow">

            ›

        </div>

    `;


    linksContainer.appendChild(
        element
    );


});


</script>


</body>

</html>
