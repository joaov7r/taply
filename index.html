<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Barbearia Dom Roger</title>

    <style>

        :root {
            --primary: #050505;
            --secondary: rgba(20,20,20,0.78);
            --text: #ffffff;
            --muted: #a0a0a0;
            --border: rgba(255,255,255,0.10);
        }


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            min-height: 100vh;

            background:

                radial-gradient(
                    circle at 50% -10%,
                    rgba(255,255,255,0.10),
                    transparent 35%
                ),

                radial-gradient(
                    circle at 0% 100%,
                    rgba(255,255,255,0.04),
                    transparent 35%
                ),

                var(--primary);

            color: var(--text);

            display: flex;

            justify-content: center;

        }


        body.modal-open {
            overflow: hidden;
        }


        /* =========================================
           CONTAINER
        ========================================= */

        .container {

            width: 100%;

            max-width: 520px;

            min-height: 100vh;

            padding:
                42px 22px 25px;

            display: flex;

            flex-direction: column;

            align-items: center;

        }


        /* =========================================
           LOGO
        ========================================= */

        .logo {

            width: 100%;

            max-width: 350px;

            margin-bottom: 13px;

            display: flex;

            justify-content: center;

        }


        .logo img {

            width: 100%;

            height: auto;

            display: block;

            object-fit: contain;

        }


        /* =========================================
           DESCRIÇÃO
        ========================================= */

        .description {

            font-size: 13px;

            color: var(--muted);

            text-align: center;

            line-height: 1.6;

            max-width: 360px;

            margin-bottom: 20px;

            letter-spacing: 0.2px;

        }


        /* =========================================
           ÍCONES SOCIAIS
        ========================================= */

        .socials {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 15px;

            margin-bottom: 28px;

        }


        .social-button {

            width: 52px;

            height: 52px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            text-decoration: none;

            color: white;

            background:
                rgba(255,255,255,0.06);

            border:
                1px solid
                rgba(255,255,255,0.10);

            backdrop-filter: blur(10px);

            -webkit-backdrop-filter: blur(10px);

            cursor: pointer;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                border-color 0.2s ease;

        }


        .social-button:hover {

            transform:
                translateY(-3px);

            background:
                rgba(255,255,255,0.11);

            border-color:
                rgba(255,255,255,0.20);

        }


        .social-button svg {

            width: 24px;

            height: 24px;

        }


        /* =========================================
           LINKS PRINCIPAIS
        ========================================= */

        .main-links {

            width: 100%;

            display: flex;

            flex-direction: column;

            gap: 12px;

        }


        .main-link {

            width: 100%;

            min-height: 68px;

            padding: 12px 17px;

            border-radius: 17px;

            background:
                rgba(20,20,20,0.78);

            border:
                1px solid
                var(--border);

            backdrop-filter: blur(12px);

            -webkit-backdrop-filter: blur(12px);

            color: white;

            text-decoration: none;

            display: flex;

            align-items: center;

            position: relative;

            cursor: pointer;

            box-shadow:
                0 8px 28px
                rgba(0,0,0,0.22);

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                border-color 0.2s ease;

        }


        .main-link:hover {

            transform:
                translateY(-2px);

            background:
                rgba(30,30,30,0.88);

            border-color:
                rgba(255,255,255,0.16);

        }


        .main-icon {

            width: 43px;

            height: 43px;

            border-radius: 13px;

            background:
                rgba(255,255,255,0.07);

            display: flex;

            align-items: center;

            justify-content: center;

            margin-right: 14px;

            flex-shrink: 0;

        }


        .main-icon svg {

            width: 22px;

            height: 22px;

        }


        .main-content {

            display: flex;

            flex-direction: column;

            gap: 3px;

            text-align: left;

        }


        .main-title {

            font-size: 15px;

            font-weight: 600;

        }


        .main-subtitle {

            font-size: 11px;

            color: var(--muted);

        }


        .main-arrow {

            margin-left: auto;

            font-size: 23px;

            color: #666;

        }


        /* =========================================
           MODAL
        ========================================= */

        .modal {

            position: fixed;

            inset: 0;

            width: 100%;

            height: 100%;

            background:
                rgba(0,0,0,0.78);

            backdrop-filter:
                blur(10px);

            -webkit-backdrop-filter:
                blur(10px);

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 18px;

            z-index: 999;

            opacity: 0;

            visibility: hidden;

            transition:
                opacity 0.25s ease,
                visibility 0.25s ease;

        }


        .modal.active {

            opacity: 1;

            visibility: visible;

        }


        /* =========================================
           MODAL CONTENT
        ========================================= */

        .modal-content {

            width: 100%;

            max-width: 480px;

            max-height: 90vh;

            overflow-y: auto;

            background:
                #101010;

            border:
                1px solid
                rgba(255,255,255,0.11);

            border-radius: 23px;

            padding: 22px;

            box-shadow:
                0 30px 90px
                rgba(0,0,0,0.60);

            transform:
                translateY(20px)
                scale(0.96);

            transition:
                transform 0.25s ease;

        }


        .modal.active
        .modal-content {

            transform:
                translateY(0)
                scale(1);

        }


        /* =========================================
           MODAL HEADER
        ========================================= */

        .modal-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 20px;

        }


        .modal-title {

            font-size: 20px;

            font-weight: 700;

        }


        .modal-subtitle {

            font-size: 11px;

            color: var(--muted);

            margin-top: 4px;

        }


        .close-button {

            width: 36px;

            height: 36px;

            border-radius: 50%;

            border:
                1px solid
                rgba(255,255,255,0.08);

            background: #1a1a1a;

            color: white;

            font-size: 22px;

            display: flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;

            transition: 0.18s ease;

        }


        .close-button:hover {

            background: #292929;

        }


        /* =========================================
           UNIDADES
        ========================================= */

        .units {

            display: flex;

            flex-direction: column;

            gap: 11px;

        }


        .unit {

            width: 100%;

            padding: 15px;

            border-radius: 16px;

            background:
                #161616;

            border:
                1px solid
                rgba(255,255,255,0.07);

        }


        .unit-name {

            font-size: 15px;

            font-weight: 600;

            margin-bottom: 4px;

        }


        .unit-address {

            font-size: 11px;

            color: var(--muted);

            line-height: 1.4;

            margin-bottom: 13px;

        }


        .unit-actions {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 8px;

        }


        .unit-button {

            min-height: 40px;

            border-radius: 10px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 6px;

            text-decoration: none;

            font-size: 11px;

            font-weight: 600;

            color: white;

            background:
                #202020;

            border:
                1px solid
                rgba(255,255,255,0.08);

            transition: 0.18s ease;

        }


        .unit-button:hover {

            background:
                #292929;

            transform:
                translateY(-1px);

        }


        .unit-button svg {

            width: 15px;

            height: 15px;

        }


        .review-button {

            background:
                white;

            color:
                #050505;

            border: none;

        }


        .review-button:hover {

            background:
                #eeeeee;

        }


        /* =========================================
           FOOTER
        ========================================= */

        .footer {

            margin-top: auto;

            padding-top: 40px;

            text-align: center;

        }


        .powered {

            font-size: 11px;

            color: #666;

            letter-spacing: 0.4px;

        }


        .powered strong {

            color: #999;

            font-weight: 600;

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 420px) {

            .container {

                padding:
                    32px 17px 22px;

            }


            .logo {

                max-width: 320px;

            }


            .social-button {

                width: 50px;

                height: 50px;

            }


            .modal {

                padding: 14px;

            }


            .modal-content {

                padding: 18px;

                border-radius: 20px;

                max-height: 92vh;

            }


            .modal-title {

                font-size: 18px;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- =========================================
         LOGO
    ========================================= -->

    <div class="logo">

        <img
            src="logo-dom-roger.png"
            alt="Barbearia Dom Roger"
        >

    </div>


    <!-- =========================================
         DESCRIÇÃO
    ========================================= -->

    <p class="description">

        Corte • Barba • Estilo<br>

        Atendimento com qualidade e personalidade.

    </p>


    <!-- =========================================
         ÍCONES
    ========================================= -->

    <div
        class="socials"
        id="socials"
    ></div>


    <!-- =========================================
         LINKS
    ========================================= -->

    <div
        class="main-links"
        id="mainLinks"
    ></div>


    <!-- =========================================
         FOOTER
    ========================================= -->

    <div class="footer">

        <div class="powered">

            Powered by <strong>Taply</strong>

        </div>

    </div>


</div>


<!-- =============================================
     POPUP DAS UNIDADES
============================================= -->

<div
    class="modal"
    id="unitsModal"
>

    <div
        class="modal-content"
        id="modalContent"
    >

        <div class="modal-header">

            <div>

                <div class="modal-title">

                    Escolha sua unidade

                </div>

                <div class="modal-subtitle">

                    Encontre a unidade mais próxima de você

                </div>

            </div>


            <button
                class="close-button"
                id="closeModal"
                aria-label="Fechar"
            >

                ×

            </button>

        </div>


        <div
            class="units"
            id="units"
        ></div>

    </div>

</div>


<script>


/* =====================================================
   CONFIGURAÇÃO DO CLIENTE
===================================================== */


const estabelecimento = {

    nome:
        "Barbearia Dom Roger",


    telefone:
        "551198734659",


    whatsapp:
        "https://wa.me/551198734659",


    instagram:
        "https://www.instagram.com/dom.roger_/",


    agendamento:
        "https://cashbarber.com.br/barbeariadomroger/inicio",


    unidades: [

        {

            nome:
                "Jardim da Glória",

            endereco:
                "Cotia - SP",

            maps:
                "https://share.google/I5p1aL1oMb2lvJbr3",

            google:
                "https://www.google.com/search?q=Barbearia+Dom+Roger+Jardim+Da+Gl%C3%B3ria+Cotia"

        },


        {

            nome:
                "Matriz",

            endereco:
                "Av. Eid Mansur, 803 - Parque São George",

            maps:
                "https://share.google/pO2cxL504a6fTDSEa",

            google:
                "https://www.google.com/search?q=Barbearia+Dom+Roger+Matriz+Cotia"

        },


        {

            nome:
                "Vianna Village",

            endereco:
                "R. Mesopotâmia, 109 - Cotia",

            maps:
                "https://share.google/yslnNkrHiEY3EZdB3",

            google:
                "https://www.google.com/search?q=Barbearia+Dom+Roger+Vianna+Village+Cotia"

        },


        {

            nome:
                "Capuava",

            endereco:
                "Estr. do Capuava, 4421 - Cotia",

            maps:
                "https://share.google/3BkKdrDc8EXBG0CYs",

            google:
                "https://www.google.com/search?q=Barbearia+Dom+Roger+Capuava+Cotia"

        }

    ]

};


/* =====================================================
   ÍCONES
===================================================== */


const whatsappIcon = `

<svg viewBox="0 0 48 48">

    <path
        fill="#25D366"
        d="M24 4C13 4 4 12.9 4 23.8c0 3.5.9 6.9 2.7 9.9L4 44l10.6-2.7c2.9 1.6 6.1 2.4 9.4 2.4 11 0 20-8.9 20-19.9S35 4 24 4z"
    />

    <path
        fill="#fff"
        d="M34.5 28.7c-.5-.3-3.1-1.5-3.6-1.7-.5-.2-.8-.3-1.2.3-.3.5-1.3 1.7-1.6 2.1-.3.4-.6.4-1.1.1-.5-.3-2.1-.8-4-2.5-1.5-1.3-2.5-2.9-2.8-3.4-.3-.5 0-.8.2-1.1.2-.2.5-.6.8-.9.3-.3.3-.5.5-.9.2-.4.1-.7 0-1-.1-.3-1.2-2.9-1.7-4-.5-1.1-1-1-1.3-1h-1.1c-.4 0-1 .1-1.5.7-.5.5-2 1.9-2 4.6s2 5.3 2.3 5.7c.3.4 3.9 6 9.4 8.4 1.3.6 2.4 1 3.2 1.2 1.3.4 2.5.3 3.4.2 1-.1 3.1-1.3 3.5-2.5.4-1.2.4-2.2.3-2.5-.1-.3-.5-.4-1-.7z"
    />

</svg>

`;


const instagramIcon = `

<svg viewBox="0 0 48 48">

    <defs>

        <linearGradient
            id="instagramGradient"
            x1="0%"
            y1="100%"
            x2="100%"
            y2="0%"
        >

            <stop
                offset="0%"
                stop-color="#FFDD55"
            />

            <stop
                offset="30%"
                stop-color="#FF543E"
            />

            <stop
                offset="60%"
                stop-color="#C837AB"
            />

            <stop
                offset="100%"
                stop-color="#405DE6"
            />

        </linearGradient>

    </defs>


    <rect
        x="4"
        y="4"
        width="40"
        height="40"
        rx="11"
        fill="url(#instagramGradient)"
    />


    <circle
        cx="24"
        cy="24"
        r="9"
        fill="none"
        stroke="#fff"
        stroke-width="3"
    />


    <circle
        cx="34"
        cy="14"
        r="2.2"
        fill="#fff"
    />

</svg>

`;


const locationIcon = `

<svg viewBox="0 0 24 24">

    <path
        d="M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
    />

    <circle
        cx="12"
        cy="9"
        r="2.2"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
    />

</svg>

`;


const calendarIcon = `

<svg viewBox="0 0 24 24">

    <rect
        x="3"
        y="5"
        width="18"
        height="16"
        rx="2"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
    />

    <path
        d="M16 3v4M8 3v4M3 10h18"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
    />

</svg>

`;


const phoneIcon = `

<svg viewBox="0 0 24 24">

    <path
        d="M6.6 3.5l3 1.2 1.1 3.1-2 1.8c1 2.1 2.7 3.8 4.8 4.8l1.8-2 3.1 1.1 1.2 3c.2.5-.1 1.1-.6 1.3-1 .4-2.1.6-3.2.4-5.9-1-10.5-5.6-11.5-11.5-.2-1.1 0-2.2.4-3.2.2-.5.8-.7 1.3-.5Z"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linejoin="round"
    />

</svg>

`;


const starIcon = `

<svg viewBox="0 0 24 24">

    <path
        d="M12 3.5l2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.9l6.1-.9L12 3.5z"
        fill="currentColor"
    />

</svg>

`;


/* =====================================================
   ELEMENTOS
===================================================== */


const socials =
    document.getElementById(
        "socials"
    );


const mainLinks =
    document.getElementById(
        "mainLinks"
    );


const unitsContainer =
    document.getElementById(
        "units"
    );


const modal =
    document.getElementById(
        "unitsModal"
    );


const closeModal =
    document.getElementById(
        "closeModal"
    );


/* =====================================================
   ÍCONES SOCIAIS
===================================================== */


/* WhatsApp */

const whatsappButton =
    document.createElement("a");


whatsappButton.className =
    "social-button";


whatsappButton.href =
    estabelecimento.whatsapp;


whatsappButton.target =
    "_blank";


whatsappButton.rel =
    "noopener noreferrer";


whatsappButton.setAttribute(
    "aria-label",
    "WhatsApp"
);


whatsappButton.innerHTML =
    whatsappIcon;


socials.appendChild(
    whatsappButton
);


/* Instagram */

const instagramButton =
    document.createElement("a");


instagramButton.className =
    "social-button";


instagramButton.href =
    estabelecimento.instagram;


instagramButton.target =
    "_blank";


instagramButton.rel =
    "noopener noreferrer";


instagramButton.setAttribute(
    "aria-label",
    "Instagram"
);


instagramButton.innerHTML =
    instagramIcon;


socials.appendChild(
    instagramButton
);


/* Localização */

const locationButton =
    document.createElement("button");


locationButton.className =
    "social-button";


locationButton.type =
    "button";


locationButton.setAttribute(
    "aria-label",
    "Localização"
);


locationButton.innerHTML =
    locationIcon;


socials.appendChild(
    locationButton
);


/* =====================================================
   ABRIR LOCALIZAÇÃO
===================================================== */


locationButton.addEventListener(
    "click",
    () => {

        /*
         * Se tiver apenas uma unidade,
         * abre o Maps diretamente.
         *
         * Se tiver várias,
         * abre o popup.
         */

        if (
            estabelecimento.unidades.length === 1
        ) {

            window.open(
                estabelecimento.unidades[0].maps,
                "_blank"
            );

            return;

        }


        abrirModal();

    }
);


/* =====================================================
   LINKS PRINCIPAIS
===================================================== */


const links = [

    {

        icon:
            calendarIcon,

        title:
            "Agende seu horário",

        subtitle:
            "Escolha sua unidade e horário",

        url:
            estabelecimento.agendamento

    },


    {

        icon:
            starIcon,

        title:
            "Avalie no Google",

        subtitle:
            "Deixe sua avaliação",

        action:
            "google"

    }

];


links.forEach(
    link => {


        const element =
            document.createElement(
                link.url
                    ? "a"
                    : "div"
            );


        element.className =
            "main-link";


        if (link.url) {

            element.href =
                link.url;

            element.target =
                "_blank";

            element.rel =
                "noopener noreferrer";

        }


        if (link.action === "google") {

            element.addEventListener(
                "click",
                abrirModal
            );

        }


        element.innerHTML = `

            <div class="main-icon">

                ${link.icon}

            </div>


            <div class="main-content">

                <div class="main-title">

                    ${link.title}

                </div>


                <div class="main-subtitle">

                    ${link.subtitle}

                </div>

            </div>


            <div class="main-arrow">

                ›

            </div>

        `;


        mainLinks.appendChild(
            element
        );

    }
);


/* =====================================================
   CRIAR UNIDADES
===================================================== */


estabelecimento.unidades.forEach(
    unidade => {


        const element =
            document.createElement(
                "div"
            );


        element.className =
            "unit";


        element.innerHTML = `

            <div class="unit-name">

                ${unidade.nome}

            </div>


            <div class="unit-address">

                ${unidade.endereco}

            </div>


            <div class="unit-actions">


                <a
                    class="unit-button"
                    href="tel:+${estabelecimento.telefone}"
                >

                    ${phoneIcon}

                    Ligar

                </a>


                <a
                    class="unit-button"
                    href="${unidade.maps}"
                    target="_blank"
                    rel="noopener noreferrer"
                >

                    ${locationIcon}

                    Como chegar

                </a>


                <a
                    class="unit-button review-button"
                    href="${unidade.google}"
                    target="_blank"
                    rel="noopener noreferrer"
                    style="grid-column: 1 / -1;"
                >

                    ${starIcon}

                    Avaliar no Google

                </a>


            </div>

        `;


        unitsContainer.appendChild(
            element
        );

    }
);


/* =====================================================
   MODAL
===================================================== */


function abrirModal() {

    modal.classList.add(
        "active"
    );

    document.body.classList.add(
        "modal-open"
    );

}


function fecharModal() {

    modal.classList.remove(
        "active"
    );

    document.body.classList.remove(
        "modal-open"
    );

}


/* Fechar no X */

closeModal.addEventListener(
    "click",
    fecharModal
);


/* Fechar clicando fora */

modal.addEventListener(
    "click",
    event => {

        if (
            event.target === modal
        ) {

            fecharModal();

        }

    }
);


/* Fechar com ESC */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            fecharModal();

        }

    }
);


</script>


</body>

</html>
