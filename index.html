<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Taply</title>

    <style>

        :root {
            --primary: #050505;
            --secondary: rgba(20,20,20,0.78);
            --text: #ffffff;
            --muted: #a0a0a0;
            --border: rgba(255,255,255,0.10);]

            --cliente-fundo: none;
        }


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    min-height: 100vh;

    background: #050505;

    color: var(--text);

    display: flex;

    justify-content: center;

    position: relative;

}
       body::before {

    content: "";

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    background:
    linear-gradient(
        rgba(0, 0, 0, 0.72),
        rgba(0, 0, 0, 0.88)
    ),
    var(--cliente-fundo);

    background-position: center center;

    background-size: cover;

    background-repeat: no-repeat;

    pointer-events: none;

    z-index: 0;

}


        body.modal-open {
            overflow: hidden;
        }


        /* =========================================
           CONTAINER
        ========================================= */

       .container {

    width: 100%;

    max-width: 520px;

    min-height: 100vh;

    padding:
        42px 22px 25px;

    display: flex;

    flex-direction: column;

    align-items: center;

    position: relative;

    z-index: 1;

}


        /* =========================================
           LOGO
        ========================================= */

.logo {
    width: 100%;
    max-width: 410px;
    margin-bottom: 10px;
    display: flex;
    justify-content: center;
}

.logo img {
    width: 100%;
    max-width: 410px;
    height: auto;
    display: block;
    object-fit: contain;
}


        /* =========================================
           DESCRIÇÃO
        ========================================= */

       .description {

    font-size: 20px;
    white-space: normal;
    color: #c0bbb4;
    text-align: center;
    line-height: 1.5;
    width: 100%;
    max-width: 380px;
    margin-bottom: 20px;
    letter-spacing: 0.2px;

}


        /* =========================================
           ÍCONES SOCIAIS
        ========================================= */

        .socials {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 15px;

            margin-bottom: 28px;

        }


        .social-button {

            width: 52px;

            height: 52px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            text-decoration: none;

            color: white;

          background:
    linear-gradient(
        135deg,
        rgba(35,35,35,0.72),
        rgba(12,12,12,0.82)
    );

border:
    1px solid
    rgba(255,255,255,0.20);

backdrop-filter:
    blur(18px);

-webkit-backdrop-filter:
    blur(18px);

box-shadow:
    0 12px 40px
    rgba(0,0,0,0.35);
            cursor: pointer;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                border-color 0.2s ease;

        }


        .social-button:hover {

            transform:
                translateY(-3px);

            background:
                rgba(255,255,255,0.11);

            border-color:
                rgba(255,255,255,0.20);

        }


        .social-button svg {

            width: 28px;

            height: 28px;

        }


        /* =========================================
           LINKS PRINCIPAIS
        ========================================= */

        .main-links {

            width: 100%;

            display: flex;

            flex-direction: column;

            gap: 12px;

        }


        .main-link {

            width: 100%;

            min-height: 68px;

            padding: 12px 17px;

            border-radius: 17px;

            background:
                rgba(20,20,20,0.78);

          border:
                1px solid
                rgba(255,255,255,0.20);

            backdrop-filter: blur(12px);

            -webkit-backdrop-filter: blur(12px);

            color: white;

            text-decoration: none;

            display: flex;

            align-items: center;

            position: relative;

            cursor: pointer;

            box-shadow:
                0 8px 28px
                rgba(0,0,0,0.22);

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                border-color 0.2s ease;

        }


        .main-link:hover {

            transform:
                translateY(-2px);

            background:
                rgba(30,30,30,0.88);

            border-color:
                rgba(255,255,255,0.16);

        }


        .main-icon {

            width: 43px;

            height: 43px;

            border-radius: 13px;

            background:
                rgba(255,255,255,0.07);

            display: flex;

            align-items: center;

            justify-content: center;

            margin-right: 14px;

            flex-shrink: 0;

        }

        /* CORES DOS ÍCONES */

        .main-link:nth-child(1) .main-icon {
            color: #4A90E2;
        }
        
        .main-link:nth-child(2) .main-icon {
            color: #E53935;
        }
        
        .main-link:nth-child(3) .main-icon {
            color: #F4B400;
        }


        .main-icon svg {

            width: 22px;

            height: 22px;

        }


        .main-content {

            display: flex;

            flex-direction: column;

            gap: 3px;

            text-align: left;

        }


        .main-title {

            font-size: 15px;

            font-weight: 600;

        }


        .main-subtitle {

            font-size: 11px;

            color: var(--muted);

        }


        .main-arrow {

            margin-left: auto;

            font-size: 23px;

            color: #666;

        }


        /* =========================================
           MODAL
        ========================================= */

        .modal {

            position: fixed;

            inset: 0;

            width: 100%;

            height: 100%;

            background:
                rgba(0,0,0,0.78);

            backdrop-filter:
                blur(10px);

            -webkit-backdrop-filter:
                blur(10px);

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 18px;

            z-index: 999;

            opacity: 0;

            visibility: hidden;

            transition:
                opacity 0.25s ease,
                visibility 0.25s ease;

        }


        .modal.active {

            opacity: 1;

            visibility: visible;

        }


        /* =========================================
           MODAL CONTENT
        ========================================= */

        .modal-content {

            width: 100%;

            max-width: 480px;

            max-height: 90vh;

            overflow-y: auto;

            background:
                #101010;

            border:
                1px solid
                rgba(255,255,255,0.11);

            border-radius: 23px;

            padding: 22px;

            box-shadow:
                0 30px 90px
                rgba(0,0,0,0.60);

            transform:
                translateY(20px)
                scale(0.96);

            transition:
                transform 0.25s ease;

        }


        .modal.active .modal-content {

            transform:
                translateY(0)
                scale(1);

        }


        /* =========================================
           MODAL HEADER
        ========================================= */

        .modal-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 20px;

        }


        .modal-title {

            font-size: 20px;

            font-weight: 700;

        }


        .modal-subtitle {

            font-size: 11px;

            color: var(--muted);

            margin-top: 4px;

        }


        .close-button {

            width: 36px;

            height: 36px;

            border-radius: 50%;

            border:
                1px solid
                rgba(255,255,255,0.08);

            background: #1a1a1a;

            color: white;

            font-size: 22px;

            display: flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;

            transition: 0.18s ease;

        }


        .close-button:hover {

            background: #292929;

        }


        /* =========================================
           UNIDADES
        ========================================= */

        .units {

            display: flex;

            flex-direction: column;

            gap: 11px;

        }


        .unit {

            width: 100%;

            padding: 15px;

            border-radius: 16px;

            background:
                #161616;

            border:
                1px solid
                rgba(255,255,255,0.20);

        }


        .unit-name {

            font-size: 15px;

            font-weight: 600;

            margin-bottom: 4px;

        }


        .unit-address {

            font-size: 11px;

            color: var(--muted);

            line-height: 1.5;

            margin-bottom: 13px;

        }


               .unit-button {

            width: 100%;

            min-height: 42px;

            border-radius: 10px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 7px;

            text-decoration: none;

            font-size: 11px;

            font-weight: 600;

            color: #e8e5e1;

            background:
                #252321;

            border:
                1px solid
                #35322f;

            box-shadow:
                inset 0 1px 0
                rgba(255,255,255,0.025);

            transition:
                background 0.18s ease,
                border-color 0.18s ease,
                transform 0.18s ease,
                box-shadow 0.18s ease;

        }


        .unit-button:hover {

            background:
                #2c2926;

            border-color:
                #403b36;

            transform:
                translateY(-1px);

            box-shadow:
                0 5px 16px
                rgba(0,0,0,0.18);

        }


        .unit-button:active {

            background:
                #211f1d;

            transform:
                scale(0.985);

        }


        .unit-button svg {

            width: 16px;

            height: 16px;

        }

        /* ÍCONE DE LOCALIZAÇÃO - VERMELHO */
        #locationUnits .unit-button svg {
            color: #E53935;
        }
        
        /* ÍCONE DE AVALIAÇÃO - AMARELO */
        #reviewUnits .unit-button svg {
            color: #F4B400;
        }


        .review-button {

            color: #e8e5e1;

            background:
                #252321;

            border:
                1px solid
                #35322f;

        }


        .review-button:hover {

            background:
                #2c2926;

            border-color:
                #403b36;

        }


        /* =========================================
           FOOTER
        ========================================= */

        .footer {

            margin-top: auto;

            padding-top: 40px;

            text-align: center;

        }


        .powered {

            font-size: 11px;

            color: #666;

            letter-spacing: 0.4px;

        }


        .powered strong {

            color: #999;

            font-weight: 600;

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 420px) {

            .container {

                padding:
                    32px 17px 22px;

            }


           .logo {
                max-width: 390px;
            }


            .social-button {

                width: 50px;

                height: 50px;

            }


            .modal {

                padding: 14px;

            }


            .modal-content {

                padding: 18px;

                border-radius: 20px;

                max-height: 92vh;

            }


            .modal-title {

                font-size: 18px;

            }

        }

    </style>

</head>


<body style="visibility: hidden;">

        <img

        >

</div>

<script src="./cliente.js"></script>
<script>


/* =====================================================
   CONFIGURAÇÃO DO CLIENTE
===================================================== */


/* =====================================================
   ÍCONES
===================================================== */


const instagramIcon = `

const locationIcon = `

const calendarIcon = `

<svg viewBox="0 0 24 24">

    <rect

    const cardapioIcon = `

<svg viewBox="0 0 24 24">

    <path
        d="M6 3v18M6 3c2 0 4 1.5 4 4s-2 4-4 4M18 3v18M15 3v6c0 2 1.5 3 3 3"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
    />

</svg>

`;

const whatsappIcon = `
<svg
    viewBox="0 0 24 24"
    xmlns="http://www.w3.org/2000/svg"
    aria-hidden="true"
>
    <circle
        cx="12"
        cy="12"
        r="11"
        fill="#25D366"
    />

    <path
        fill="#ffffff"
        d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.372-.025-.521-.075-.149-.669-1.611-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.372-.01-.57-.01-.198 0-.52.075-.792.372-.273.298-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.095 3.2 5.076 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"
    />

    <path
        fill="#ffffff"
        d="M12.004 2C6.478 2 1.999 6.477 1.999 12c0 1.765.461 3.421 1.267 4.858L2 22l5.29-1.247A9.954 9.954 0 0 0 12.004 22C17.523 22 22 17.523 22 12S17.523 2 12.004 2zm0 18.182a8.17 8.17 0 0 1-4.164-1.138l-.298-.177-3.14.74.756-3.061-.194-.314A8.162 8.162 0 1 1 12.004 20.182z"
    />
</svg>
`;


const starIcon = `

<svg viewBox="0 0 24 24">

    <path
        d="M12 3.5l2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.9l6.1-.9L12 3.5z"
        fill="currentColor"
    />

</svg>

`;


/* =====================================================
   ELEMENTOS
===================================================== */

    /* =====================================================
   IDENTIDADE VISUAL DO CLIENTE
===================================================== */

/* =====================================================
   IDENTIDADE VISUAL DO CLIENTE
===================================================== */

const logo = document.querySelector(".logo img");

if (
    estabelecimento.logo &&
    !estabelecimento.logo.endsWith("/")
) {
    logo.src = estabelecimento.logo;
} else {
    logo.src = "assets/logos/logo-taply.png";
}

logo.alt = estabelecimento.nome;

document.getElementById("description").innerHTML =
    estabelecimento.descricao;

document.title = estabelecimento.nome;

const fundo = estabelecimento.fundo;

if (
    fundo &&
    !fundo.endsWith("/")
) {
    document.body.style.setProperty(
        "--cliente-fundo",
        `url("${fundo}")`
    );
} else {
    document.body.style.setProperty(
        "--cliente-fundo",
        'url("assets/backgrounds/fundo-taply.png")'
    );
}

const socials =
    document.getElementById(
        "socials"
    );


const mainLinks =
    document.getElementById(
        "mainLinks"
    );


const locationUnits =
    document.getElementById(
        "locationUnits"
    );


const reviewUnits =
    document.getElementById(
        "reviewUnits"
    );


/* =====================================================
   POPUPS
===================================================== */


const locationModal =
    document.getElementById(
        "locationModal"
    );


const reviewModal =
    document.getElementById(
        "reviewModal"
    );


/* =====================================================
   ABRIR MODAL
===================================================== */


function abrirModal(modal) {

    modal.classList.add(
        "active"
    );

    document.body.classList.add(
        "modal-open"
    );

}


/* =====================================================
   FECHAR MODAL
===================================================== */


function fecharModal(modal) {

    modal.classList.remove(
        "active"
    );

    document.body.classList.remove(
        "modal-open"
    );

}


/* =====================================================
   ÍCONES SOCIAIS
===================================================== */


/* WhatsApp */

const whatsappButton =
    document.createElement("a");


whatsappButton.className =
    "social-button";


whatsappButton.href =
    estabelecimento.whatsapp;


whatsappButton.target =
    "_blank";


whatsappButton.rel =
    "noopener noreferrer";


whatsappButton.setAttribute(
    "aria-label",
    "WhatsApp"
);


whatsappButton.innerHTML =
    whatsappIcon;


socials.appendChild(
    whatsappButton
);


/* Instagram */

const instagramButton =
    document.createElement("a");


instagramButton.className =
    "social-button";


instagramButton.href =
    estabelecimento.instagram;


instagramButton.target =
    "_blank";


instagramButton.rel =
    "noopener noreferrer";


instagramButton.setAttribute(
    "aria-label",
    "Instagram"
);


instagramButton.innerHTML =
    instagramIcon;


socials.appendChild(
    instagramButton
);


/* =====================================================
   LINKS PRINCIPAIS
===================================================== */


/*
   =====================================================
   ÍCONES DOS BOTÕES PRINCIPAIS

   Os ícones são definidos manualmente aqui.
   O clientes.js apenas informa o NOME do ícone.

   Exemplo:
   botao1Icone: "whatsapp"
   botao2Icone: "cardapio"
   botao3Icone: "meuIcone"

   Para adicionar um novo ícone, basta:
   1. criar a constante do SVG acima;
   2. adicionar o nome abaixo.
   =====================================================
*/

const iconesBotoes = {
    whatsapp: whatsappIcon,
    instagram: instagramIcon,
    localizacao: locationIcon,
    avaliacao: starIcon,
    agendamento: calendarIcon,
    cardapio: cardapioIcon

    // Adicione seus próximos ícones aqui:
    // telefone: telefoneIcon,
    // promocao: promocaoIcon,
    // pagamento: pagamentoIcon,
    // meuIcone: meuIcone
};


/*
   =====================================================
   BOTÕES PRINCIPAIS

   Cada botão é independente.
   Não existe mais seleção automática de ícone.

   O clientes.js poderá ter:

   botao1
   botao1Subtitulo
   botao1Icone
   botao1Link

   botao2
   botao2Subtitulo
   botao2Icone
   botao2Link

   botao3
   botao3Subtitulo
   botao3Icone
   botao3Link

   ... e assim por diante.
   =====================================================
*/

const links = [];

for (let i = 1; i <= 10; i++) {

    const titulo =
        estabelecimento.botoes?.[`botao${i}`];

    if (!titulo) {
        continue;
    }

    const iconeNome =
        estabelecimento.botoes?.[`botao${i}Icone`];

    const icone =
        iconeNome &&
        iconesBotoes[iconeNome]
            ? iconesBotoes[iconeNome]
            : "";

    const subtitulo =
        estabelecimento.botoes?.[`botao${i}Subtitulo`] || "";

    const url =
        estabelecimento[`botao${i}Link`] || "";

    links.push({
        icon: icone,
        title: titulo,
        subtitle: subtitulo,
        url: url
    });
}


/*
   =====================================================
   BOTÕES PADRÃO
   Localização e avaliação continuam separados
   dos botões personalizados.
   =====================================================
*/

links.push({

    icon:
        locationIcon,

    title:
        estabelecimento.botoes.localizacao,

    subtitle:
        estabelecimento.botoes.localizacaoSubtitulo,

    action:
        "location"

});


links.push({

    icon:
        starIcon,

    title:
        estabelecimento.botoes.avaliacao,

    subtitle:
        estabelecimento.botoes.avaliacaoSubtitulo,

    action:
        "review"

});


links.forEach(
    link => {


        const element =
            document.createElement(
                link.url
                    ? "a"
                    : "div"
            );


        element.className =
            "main-link";


        if (link.url) {

            element.href =
                link.url;

            element.target =
                "_blank";

            element.rel =
                "noopener noreferrer";

        }


       if (
    link.action ===
    "location"
) {

    element.addEventListener(
        "click",
        () => {

            if (
                estabelecimento.unidades.length === 1
            ) {

                window.open(
                    estabelecimento.unidades[0].maps,
                    "_blank"
                );

            } else {

                abrirModal(
                    locationModal
                );

            }

        }
    );

}


       if (
    link.action ===
    "review"
) {

    element.addEventListener(
        "click",
        () => {

            if (
                estabelecimento.unidades.length === 1
            ) {

                window.open(
                    estabelecimento.unidades[0].google,
                    "_blank"
                );

            } else {

                abrirModal(
                    reviewModal
                );

            }

        }
    );

}


        element.innerHTML = `

            <div class="main-icon">

                ${link.icon}

            </div>


            <div class="main-content">

                <div class="main-title">

                    ${link.title}

                </div>


                <div class="main-subtitle">

                    ${link.subtitle}

                </div>

            </div>


            <div class="main-arrow">

                ›

            </div>

        `;


        mainLinks.appendChild(
            element
        );

    }
);


/* =====================================================
   POPUP DE LOCALIZAÇÃO
===================================================== */


estabelecimento.unidades.forEach(
    unidade => {


        const element =
            document.createElement(
                "div"
            );


        element.className =
            "unit";


        element.innerHTML = `

            <div class="unit-name">

                ${unidade.nome}

            </div>


            <div class="unit-address">

                ${unidade.endereco}

            </div>


            <a
                class="unit-button"
                href="${unidade.maps}"
                target="_blank"
                rel="noopener noreferrer"
            >

                ${locationIcon}

                Como chegar

            </a>

        `;


        locationUnits.appendChild(
            element
        );

    }
);


/* =====================================================
   POPUP DE AVALIAÇÃO
===================================================== */


estabelecimento.unidades.forEach(
    unidade => {


        const element =
            document.createElement(
                "div"
            );


        element.className =
            "unit";


        element.innerHTML = `

            <div class="unit-name">

                ${unidade.nome}

            </div>


            <div class="unit-address">

                Escolha esta unidade para avaliar.

            </div>


            <a
                class="unit-button review-button"
                href="${unidade.google}"
                target="_blank"
                rel="noopener noreferrer"
            >

                ${starIcon}

                Avaliar no Google

            </a>

        `;


        reviewUnits.appendChild(
            element
        );

    }
);


/* =====================================================
   BOTÕES FECHAR
===================================================== */


document
    .querySelectorAll(
        "[data-close]"
    )
    .forEach(
        button => {


            button.addEventListener(
                "click",
                () => {


                    const modalId =
                        button.getAttribute(
                            "data-close"
                        );


                    fecharModal(
                        document.getElementById(
                            modalId
                        )
                    );

                }
            );

        }
    );


/* =====================================================
   FECHAR CLICANDO FORA
===================================================== */


locationModal.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            locationModal
        ) {

            fecharModal(
                locationModal
            );

        }

    }
);


reviewModal.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            reviewModal
        ) {

            fecharModal(
                reviewModal
            );

        }

    }
);


/* =====================================================
   FECHAR COM ESC
===================================================== */


document.addEventListener(
    "keydown",
    event => {


        if (
            event.key === "Escape"
        ) {

            fecharModal(
                locationModal
            );

            fecharModal(
                reviewModal
            );

        }

    }
);

/* MOSTRAR PÁGINA APÓS CARREGAR O CLIENTE */

document.body.style.visibility = "visible";

</script>


</body>

</html>
