<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Barbearia Dom Roger</title>

    <style>
        :root {
            --primary: #050505;
            --secondary: #151515;
            --accent: #ffffff;
            --text: #ffffff;
            --muted: #a7a7a7;
            --button-text: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top,
                    rgba(255,255,255,0.08),
                    transparent 35%
                ),
                var(--primary);

            color: var(--text);

            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 520px;
            min-height: 100vh;

            padding: 35px 22px 25px;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* LOGO */

        .logo {
            width: 96px;
            height: 96px;

            border-radius: 50%;

            background: var(--accent);

            display: flex;
            align-items: center;
            justify-content: center;

            color: var(--primary);

            font-size: 30px;
            font-weight: 800;

            margin-bottom: 18px;

            box-shadow:
                0 10px 35px rgba(0,0,0,0.35);

            overflow: hidden;
        }

        .logo img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        /* NOME */

        .business-name {
            font-size: 25px;
            font-weight: 700;

            text-align: center;

            letter-spacing: -0.5px;

            margin-bottom: 7px;
        }

        .description {
            font-size: 14px;

            color: var(--muted);

            text-align: center;

            line-height: 1.5;

            max-width: 380px;

            margin-bottom: 27px;
        }

        /* BOTÕES */

        .links {
            width: 100%;

            display: flex;
            flex-direction: column;

            gap: 13px;
        }

        .link {
            width: 100%;

            min-height: 60px;

            padding: 14px 18px;

            border-radius: 15px;

            background: var(--secondary);

            border: 1px solid rgba(255,255,255,0.08);

            color: var(--text);

            text-decoration: none;

            display: flex;
            align-items: center;

            position: relative;

            transition:
                transform 0.18s ease,
                background 0.18s ease,
                border 0.18s ease;

            box-shadow:
                0 5px 18px rgba(0,0,0,0.18);
        }

        .link:hover {
            transform: translateY(-2px);

            background: rgba(255,255,255,0.08);

            border-color: rgba(255,255,255,0.18);
        }

        .link:active {
            transform: scale(0.98);
        }

        .icon {
            width: 38px;
            height: 38px;

            border-radius: 11px;

            background: rgba(255,255,255,0.09);

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 18px;

            margin-right: 13px;

            flex-shrink: 0;
        }

        .link-content {
            display: flex;
            flex-direction: column;

            gap: 2px;

            text-align: left;
        }

        .link-title {
            font-size: 15px;
            font-weight: 600;
        }

        .link-subtitle {
            font-size: 11px;

            color: var(--muted);
        }

        .arrow {
            margin-left: auto;

            font-size: 20px;

            color: var(--muted);
        }

        /* DESTAQUE */

        .highlight {
            background: var(--accent);

            color: var(--primary);

            border: none;
        }

        .highlight .icon {
            background: rgba(0,0,0,0.08);
        }

        .highlight .link-subtitle {
            color: rgba(0,0,0,0.55);
        }

        .highlight .arrow {
            color: rgba(0,0,0,0.5);
        }

        .highlight:hover {
            background: var(--accent);
            opacity: 0.92;
        }

        /* FOOTER */

        .footer {
            margin-top: auto;

            padding-top: 35px;

            text-align: center;
        }

        .powered {
            font-size: 11px;

            color: #777;

            letter-spacing: 0.3px;
        }

        .powered strong {
            color: #aaa;

            font-weight: 600;
        }

        /* RESPONSIVO */

        @media (max-width: 420px) {

            .container {
                padding-left: 17px;
                padding-right: 17px;
            }

            .business-name {
                font-size: 23px;
            }

            .link {
                min-height: 58px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- LOGO -->
    <div class="logo">
    <img src="logo-dom-roger.png" alt="Barbearia Dom Roger">
</div>

    <!-- INFORMAÇÕES -->
    <h1 class="business-name" id="businessName">
        Barbearia Dom Roger
    </h1>

    <p class="description" id="description">
        Corte, barba e estilo. Atendimento com qualidade e personalidade.
    </p>

    <!-- LINKS -->
    <div class="links" id="links"></div>

    <!-- FOOTER -->
    <div class="footer">
        <div class="powered">
            Powered by <strong>Taply</strong>
        </div>
    </div>

</div>


<script>

    /* =====================================================
       CONFIGURAÇÃO DO ESTABELECIMENTO
       ===================================================== */

    const estabelecimento = {

        /* NOME */
        nome: "Barbearia Dom Roger",

        /* DESCRIÇÃO */
        descricao:
            "Corte, barba e estilo. Atendimento com qualidade e personalidade.",

        /* CORES */

        corPrincipal: "#050505",

        corSecundaria: "#151515",

        corDestaque: "#FFFFFF",

        corTexto: "#FFFFFF",

        corTextoSecundario: "#A7A7A7",


        /* LOGO */

        /*
           Se tiver uma imagem da logo, coloque aqui a URL.

           Exemplo:

           logo:
           "https://meusite.com/logo.png"

           Se deixar vazio, aparecerão as letras abaixo.
        */

        logo: "",

        iniciais: "DR",


        /* LINKS */

        google:
            "https://www.google.com/",

        whatsapp:
            "https://wa.me/5511999999999",

        instagram:
            "https://instagram.com/",

        maps:
            "https://maps.google.com/",

        servicos:
            "#",

        agendamento:
            "#"
    };


    /* =====================================================
       APLICAÇÃO DAS CORES
       ===================================================== */

    document.documentElement.style.setProperty(
        "--primary",
        estabelecimento.corPrincipal
    );

    document.documentElement.style.setProperty(
        "--secondary",
        estabelecimento.corSecundaria
    );

    document.documentElement.style.setProperty(
        "--accent",
        estabelecimento.corDestaque
    );

    document.documentElement.style.setProperty(
        "--text",
        estabelecimento.corTexto
    );

    document.documentElement.style.setProperty(
        "--muted",
        estabelecimento.corTextoSecundario
    );


    /* =====================================================
       INFORMAÇÕES
       ===================================================== */

    document.getElementById("businessName").textContent =
        estabelecimento.nome;

    document.getElementById("description").textContent =
        estabelecimento.descricao;


    /* =====================================================
       LOGO
       ===================================================== */

    const logoElement = document.getElementById("logo");

    if (estabelecimento.logo !== "") {

        logoElement.innerHTML =
            `<img src="${estabelecimento.logo}" alt="Logo">`;

    } else {

        logoElement.textContent =
            estabelecimento.iniciais;

    }


    /* =====================================================
       BOTÕES
       ===================================================== */

    const links = [

        {
            icon: "⭐",
            title: "Avalie no Google",
            subtitle: "Sua opinião é muito importante",
            url: estabelecimento.google,
            highlight: true
        },

        {
            icon: "💬",
            title: "Fale pelo WhatsApp",
            subtitle: "Entre em contato conosco",
            url: estabelecimento.whatsapp
        },

        {
            icon: "📸",
            title: "Instagram",
            subtitle: "Acompanhe nosso trabalho",
            url: estabelecimento.instagram
        },

        {
            icon: "📍",
            title: "Como chegar",
            subtitle: "Veja nossa localização",
            url: estabelecimento.maps
        },

        {
            icon: "✂️",
            title: "Serviços",
            subtitle: "Conheça nossos serviços",
            url: estabelecimento.servicos
        },

        {
            icon: "📅",
            title: "Agende seu horário",
            subtitle: "Reserve seu atendimento",
            url: estabelecimento.agendamento
        }

    ];


    const linksContainer =
        document.getElementById("links");


    links.forEach(link => {

        const element =
            document.createElement("a");

        element.href = link.url;

        element.target = "_blank";

        element.rel = "noopener noreferrer";

        element.className =
            "link" +
            (link.highlight ? " highlight" : "");


        element.innerHTML = `

            <div class="icon">
                ${link.icon}
            </div>

            <div class="link-content">

                <div class="link-title">
                    ${link.title}
                </div>

                <div class="link-subtitle">
                    ${link.subtitle}
                </div>

            </div>

            <div class="arrow">
                ›
            </div>

        `;


        linksContainer.appendChild(element);

    });

</script>

</body>
</html>
